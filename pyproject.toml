[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "mandelbrot-python-rust"
version = "0.1.0"
description = "Render the Mandelbrot set, with the hot loop swapped out for Rust"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mandelbrot = "mandelbrot.cli:main"

[tool.maturin]
python-source = "python"
module-name = "mandelbrot._fast"
features = ["pyo3/extension-module"]
